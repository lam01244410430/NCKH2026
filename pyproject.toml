[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hsk-agent-bench"
version = "0.1.0"
description = "Reproducible HSK-aligned learning-material benchmark"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.12,<3", "PyYAML>=6.0.3,<7", "jieba==0.42.1"]

[project.optional-dependencies]
test = ["pytest>=9,<10"]
providers = ["openai>=1,<3", "google-genai>=1.52.0,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
